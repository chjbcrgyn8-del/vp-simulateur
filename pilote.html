 <div class="prg"><div class="prc"><h3>Périmètre</h3><ul><li><b>Un moule</b>, un ou deux défauts qui reviennent</li><li><b>${P.p} presse${P.p>1?'s':''}</b> au plus, toutes marques, sans connexion machine</li><li>Huit semaines : qualification (semaines 1 et 2), enquête guidée (3 à 6), validation et dossier du moule (7 et 8)</li><li>Deux validations par cas : le régleur qui le clôt, puis les méthodes ou la qualité</li></ul></div>

 <p class="legal" style="margin-top:12px">Proposition indicative, à confirmer par devis. La situation de départ reprend vos réponses au simulateur, ramenées aux presses du pilote. Tarifs indicatifs HT, à confirmer par devis. Aides soumises à l’éligibilité de l’entreprise et du prestataire, jamais déduites d’avance.</p>
 </section>`;};

<ul><li><b>Huit semaines</b>, prix fixe écrit au devis</li><li>Un moule, un ou deux défauts, une à trois presses</li><li>Étape 1 incluse : VP Scan, qualification et chiffrage de départ</li><li>Arrêt possible après la qualification : seule cette étape est due</li></ul>

${m?`<div class="sumbox"><p>Votre chiffrage de départ · scénario ${({cible:'ambitieux',central:'modéré'})[m.scen]||m.scen} · sans connexion machine</p><strong>${eur(m.net)} de gain net par an</strong><p>${m.n} presses. C’est une estimation : l’étape 1 du pilote la vérifie sur site, avant toute suite.</p></div>${propHTML()}`:`<div class="card"><h3>Pas encore de chiffrage</h3><p><a href="${RUB?'caoutchouc.html':'gains.html'}">Chiffrez vos pertes en 3 minutes</a> : c’est l’étape 1 du pilote, en version courte. Le résultat s’affichera ici comme situation de départ.</p></div>`}
<div class="grid"><div class="card"><h3>Livrables garantis</h3><p>Le chiffrage de départ ; le dossier du moule avec les cas validés ; la fiche de transfert si le moule change de presse ; le pré-rapport de réclamation (pré-8D) si une réclamation est en cause ; la carte de dépendance au savoir-faire ; le bilan avant et après. Établis avec vos équipes.</p></div>
